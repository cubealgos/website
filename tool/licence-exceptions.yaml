# Per-package licence exceptions for `tool/licence_check.dart`. Printed in full
# on every run. An entry is keyed on package AND licence, so a relicense stops
# it matching. Only MPL-2.0 can be excepted; copyleft is denied outright. See
# `standards/legal/dependency-license-policy.md` in the cubealgos heimathafen.
#
# exceptions:
#   - package: some_package
#     licence: MPL-2.0
#     reason: "Why this is safe."
exceptions:
  - package: axe-core
    licence: MPL-2.0
    reason: >-
      The org's existing dev-scope exception (dependency licence policy, Kevin,
      2026-09-14): axe-core arrives only as a transitive dependency of
      lighthouse in tool/a11y/ (the accessibility audit), never shipped,
      consumed unmodified. Not the @axe-core/* runners, not pa11y.

# `verified:` is a different kind of entry, for a package pub.dev reports no licence for
# AND whose LICENSE file the gate's own reader (`tool/src/licence_file.dart`) does not
# recognise: it reads standard MIT, BSD-2/3-Clause and Apache-2.0 texts from the pub cache,
# so most detection gaps need no entry. An entry matches the exact version only, never
# overrides a detected licence, and the recorded licence must itself be on the allow list.
# Printed on every run.
#
# verified:
#   - package: some_package
#     version: 1.2.3
#     licence: MIT
#     reason: "How it was verified, and when."
verified: []
